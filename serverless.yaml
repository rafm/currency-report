# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: rafmdev
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: currency-report
# "service" is the name of this project. This will also be added to your AWS resource names.
service: currency-report
frameworkVersion: "^4.17.0"
useDotenv: true

provider:
  name: aws
  runtime: nodejs24.x
  region: us-east-1
  memorySize: 512
  versionFunctions: false
  logRetentionInDays: 14
  deploymentBucket:
    maxPreviousDeploymentArtifacts: 2
    versioning: false
  environment:
    DRY_RUN: ${param:DRY_RUN, 'false'}
    AWESOME_API_TOKEN: ${env:AWESOME_API_TOKEN}
    DISCORD_CHANNEL_ID: ${env:DISCORD_CHANNEL_ID}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - ssm:GetParameter
          Resource: arn:aws:ssm:us-east-1:771362849871:parameter/discord/bot/token

functions:
  currency-report:
    name: currency-report-${sls:stage}
    handler: index.handler
    events:
      - schedule:
          method: scheduler
          rate: cron(0 18 ? * 2-6 *)
          timezone: America/Sao_Paulo

package:
  patterns:
    - '!.github/**'
    - '!.editorconfig'
    - '!serverless.yaml'
    - '!.nvmrc'
